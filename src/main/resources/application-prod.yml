spring:
  datasource:
    url: jdbc:postgresql://${RDA_DB_HOST:localhost}:${RDA_DB_PORT:5432}/${RDA_DB_NAME:reuniondearte}
    username: ${RDA_DB_USER:reuniondearte}
    password: ${RDA_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: warn
