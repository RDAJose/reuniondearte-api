spring:
  application:
    name: reuniondearte-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${RDA_MULTIPART_MAX_FILE_SIZE:250MB}
      max-request-size: ${RDA_MULTIPART_MAX_REQUEST_SIZE:260MB}
  mail:
    host: ${RDA_MAIL_HOST:}
    port: ${RDA_MAIL_PORT:587}
    username: ${RDA_MAIL_USERNAME:}
    password: ${RDA_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${RDA_MAIL_TIMEOUT_MS:10000}
          timeout: ${RDA_MAIL_TIMEOUT_MS:10000}
          writetimeout: ${RDA_MAIL_TIMEOUT_MS:10000}

server:
  port: ${PORT:${SERVER_PORT:8080}}

rda:
  storage-provider: ${RDA_STORAGE_PROVIDER:local}
  media-root: ${RDA_MEDIA_ROOT:./storage/media}
  backup-root: ${RDA_BACKUP_ROOT:./storage/backups/postgres}
  import-log-root: ${RDA_IMPORT_LOG_ROOT:./storage/import-logs}
  public-base-url: ${RDA_PUBLIC_BASE_URL:http://localhost:8080}
  allowed-origins: ${RDA_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://reuniondearte.com}
  s3-endpoint: ${RDA_S3_ENDPOINT:}
  s3-region: ${RDA_S3_REGION:auto}
  s3-bucket: ${RDA_S3_BUCKET:}
  s3-access-key: ${RDA_S3_ACCESS_KEY:}
  s3-secret-key: ${RDA_S3_SECRET_KEY:}
  s3-public-base-url: ${RDA_S3_PUBLIC_BASE_URL:}
  s3-cache-control: ${RDA_S3_CACHE_CONTROL:public, max-age=31536000}
  public-site-url: ${RDA_PUBLIC_SITE_URL:https://reuniondearte.com}
  api-public-url: ${RDA_API_PUBLIC_URL:http://localhost:8080}
  mail-provider: ${RDA_MAIL_PROVIDER:disabled}
  mail-from: ${RDA_MAIL_FROM:}
  mail-from-name: ${RDA_MAIL_FROM_NAME:Reunion de Arte}
  mail-timeout-ms: ${RDA_MAIL_TIMEOUT_MS:10000}
  brevo-api-key: ${RDA_BREVO_API_KEY:}
  brevo-api-url: ${RDA_BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
