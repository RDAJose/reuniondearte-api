services:
  postgres:
    image: postgres:16
    container_name: reuniondearte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reuniondearte
      POSTGRES_USER: reuniondearte
      POSTGRES_PASSWORD: reuniondearte_dev_password
    ports:
      - "55432:5432"
    volumes:
      - ./storage/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reuniondearte -d reuniondearte"]
      interval: 10s
      timeout: 5s
      retries: 5
